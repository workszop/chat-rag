<!-- edustyl <head> snippet. Paste it into <head> before your stylesheet / <style>.
     Fonts load here with <link>, never with @import in CSS: @import chains the requests
     and blocks rendering until the font CSS arrives (Outfit, IBM Plex Sans, Roboto Mono). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">

<!-- JS-rendered pages only (the UI is built by script): boot gate. Without it the browser
     paints the empty shell, then invisible text (Firefox) or fallback fonts, then the app -
     the "flashes raw HTML on open" bug. Delete this block for static pages. -->
<style>
  @keyframes boot-reveal { to { visibility: visible; } }
  html:not(.app-ready) body { visibility: hidden; animation: boot-reveal 0s 4s forwards; }
  @media print { html:not(.app-ready) body { visibility: visible; animation: none; } }
</style>
<noscript><style>html:not(.app-ready) body { visibility: visible; animation: none; }</style></noscript>
<style id="edu-tokens">
/* ============================================================
   edulab - Colors & Type foundation
   Fonts (Outfit, IBM Plex Sans, Roboto Mono) load from Google Fonts
   via the <link> tags in tokens/head.html - paste that into <head>.
   No @import here: it chains requests and blocks rendering.
   ============================================================ */

:root {
  /* ---- Brand fonts ---- */
  --font-display: 'Outfit', 'IBM Plex Sans', system-ui, sans-serif;
  --font-sans:    'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono:    'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ============================================================
     RAW COLOR TOKENS
     ============================================================ */

  /* Paper - page background is white; the sand steps are wells/alternating sections */
  --paper:    #FFFFFF;   /* page background (white)    */
  --paper-2:  #FBF7E6;   /* alternating section        */
  --paper-3:  #F5EDCB;   /* deepest sand / wells       */
  --surface:  #FFFFFF;   /* cards & sheets             */

  /* Ink - warm near-black text & lines */
  --ink:      #1C1917;   /* primary text               */
  --ink-2:    #57534E;   /* secondary text             */
  --ink-3:    #948C82;   /* muted / placeholder        */
  --line:     #EDE7D2;   /* hairline borders           */
  --line-2:   #DDD4B6;   /* stronger borders           */

  /* ---- Brand: Yellow main · Blue + Green secondary · Red danger ----
     Plain saturated colours. A "-soft" tint IS the saturated colour
     (panels and chips are solid), "-ink" is the text colour ON it:
     white on blue/green/red, dark ink on yellow. Never colour-on-colour
     (no green text on green); the saturated colour itself goes only on
     white or black. */

  /* Yellow - primary (buttons, progress, values on dark panels) */
  --yellow:      #FFD500;
  --yellow-600:  #F0C800;  /* hover / press          */
  --yellow-soft: #FFD500;  /* chip / panel fill      */
  --yellow-ink:  #1C1917;  /* text on yellow         */

  /* Blue - secondary (panels, chips, correct / selected state) */
  --blue:      #1E8FC2;
  --blue-600:  #177AA8;
  --blue-soft: #1E8FC2;
  --blue-ink:  #FFFFFF;

  /* Green - secondary support (chips, success) */
  --green:      #00A651;
  --green-600:  #009444;
  --green-soft: #00A651;
  --green-ink:  #FFFFFF;

  /* Red - danger / important / wrong (use sparingly) */
  --red:      #E5322D;
  --red-600:  #C92823;
  --red-soft: #E5322D;
  --red-ink:  #FFFFFF;

  /* Legacy role aliases - older edulab apps use these names */
  --marigold: var(--yellow); --marigold-600: var(--yellow-600); --marigold-soft: var(--yellow-soft); --marigold-ink: var(--yellow-ink);
  --teal:     var(--blue);   --teal-600:     var(--blue-600);   --teal-soft:     var(--blue-soft);   --teal-ink:     var(--blue-ink);
  --sky:      var(--green);                                     --sky-soft:      var(--green-soft);  --sky-ink:      var(--green-ink);
  --coral:    var(--red);    --coral-600:    var(--red-600);    --coral-soft:    var(--red-soft);    --coral-ink:    var(--red-ink);

  /* Play palette - subject/category colours in the kids app */
  --play-sun:    #FFD500;
  --play-grass:  #00A651;
  --play-berry:  #C6478B;
  --play-grape:  #7A5AC2;
  --play-sky:    #1E8FC2;
  --play-coral:  #E5322D;

  /* ---- Semantic ---- */
  --success:      #00A651;  --success-soft: #00A651;  --success-ink: #FFFFFF;
  --warning:      #FFD500;  --warning-soft: #FFD500;  --warning-ink: #1C1917;
  --danger:       #E5322D;  --danger-soft:  #E5322D;  --danger-ink:  #FFFFFF;
  --info:         #1E8FC2;  --info-soft:    #1E8FC2;  --info-ink:    #FFFFFF;

  /* ---- Functional aliases ---- */
  --bg:        var(--paper);
  --fg:        var(--ink);
  --fg-muted:  var(--ink-2);
  --primary:   var(--yellow);
  --on-primary:#1C1917;      /* dark text on yellow */
  --focus-ring: 0 0 0 3px color-mix(in srgb, var(--yellow) 45%, transparent);

  /* ============================================================
     SPACING  (4pt base)
     ============================================================ */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  --sp-12: 48px; --sp-16: 64px; --sp-20: 80px; --sp-24: 96px;

  /* ---- Radii (friendly, generous) ---- */
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

  /* ---- Elevation - warm, low, soft ---- */
  --shadow-sm: 0 1px 2px rgba(33,30,26,.06), 0 1px 1px rgba(33,30,26,.04);
  --shadow-md: 0 4px 16px rgba(33,30,26,.08), 0 1px 3px rgba(33,30,26,.05);
  --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);
  --shadow-primary:  0 8px 22px color-mix(in srgb, var(--yellow) 30%, transparent);
  --shadow-marigold: var(--shadow-primary);   /* legacy alias */

  /* ============================================================
     TYPE SCALE (semantic sizes)
     ============================================================ */
  --display-font:  clamp(48px, 6vw, 72px);
  --h1: 44px; --h2: 33px; --h3: 25px; --h4: 19px;
  --body-lg: 18px; --body: 16px; --body-sm: 14px;
  --caption: 13px; --overline: 12px;
}

/* ============================================================
   SEMANTIC ELEMENT STYLES
   Apply via element selectors or .edu-prose wrapper.
   Element defaults are wrapped in :where(.edu) (zero specificity) so any
   single class wins: <p class="edu-overline">, <p class="edu-small">,
   <h1 class="app-title"> keep their own font/size instead of the element default.
   ============================================================ */

.edu-display, :where(.edu) h1.display {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--display-font);
  line-height: 1.02;
  letter-spacing: -0.025em;
  color: var(--ink);
}
:where(.edu) h1, .edu-h1 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h1);
  line-height: 1.06; letter-spacing: -0.02em; color: var(--ink);
}
:where(.edu) h2, .edu-h2 {
  font-family: var(--font-display);
  font-weight: 600; font-size: var(--h2);
  line-height: 1.12; letter-spacing: -0.015em; color: var(--ink);
}
:where(.edu) h3, .edu-h3 {
  font-family: var(--font-display);
  font-weight: 600; font-size: var(--h3);
  line-height: 1.2; letter-spacing: -0.01em; color: var(--ink);
}
:where(.edu) h4, .edu-h4 {
  font-family: var(--font-sans);
  font-weight: 700; font-size: var(--h4);
  line-height: 1.3; color: var(--ink);
}
:where(.edu) p, .edu-p, .edu-body {
  font-family: var(--font-sans);
  font-weight: 400; font-size: var(--body);
  line-height: 1.6; color: var(--ink-2);
}
.edu-body-lg { font-family: var(--font-sans); font-size: var(--body-lg); line-height: 1.6; color: var(--ink-2); }
.edu-small  { font-family: var(--font-sans); font-size: var(--body-sm); line-height: 1.5; color: var(--ink-2); }
.edu-caption{ font-family: var(--font-sans); font-size: var(--caption); line-height: 1.45; color: var(--ink-3); }

/* Overline - mono, tracked; functional labels only (never above page/section titles) */
.edu-overline {
  font-family: var(--font-mono);
  font-weight: 500; font-size: var(--overline);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink);
}
:where(.edu) code, .edu-mono {
  font-family: var(--font-mono);
  font-size: 0.92em; color: var(--ink);
  background: var(--paper-3); padding: 0.12em 0.4em; border-radius: var(--r-xs);
}

/* Solid colour blocks (callouts, stat cards, chips): set background: var(--X-soft) and
   color: var(--X-ink) on the block, add .edu-block, and every heading/paragraph inside
   inherits that text colour instead of the default ink. */
.edu-block, .edu-block h1, .edu-block h2, .edu-block h3, .edu-block h4, .edu-block p,
.edu-block li, .edu-block small { color: inherit; }

body.edu { background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
</style>
<style>
/* ─── App tokens ─── */
:root {
  --lane-chat: var(--blue);        --lane-chat-ink: var(--blue-ink);
  --lane-rag: var(--green);        --lane-rag-ink: var(--green-ink);
  --lane-agent: var(--play-grape); --lane-agent-ink: var(--blue-ink);
  --shell-max: 1100px;
  --matrix-max: 1360px;
  --row-head-w: 11rem;
}
[data-lane="chat"]  { --lane: var(--lane-chat);  --lane-ink: var(--lane-chat-ink); }
[data-lane="rag"]   { --lane: var(--lane-rag);   --lane-ink: var(--lane-rag-ink); }
[data-lane="agent"] { --lane: var(--lane-agent); --lane-ink: var(--lane-agent-ink); }

/* ─── Edulab chrome ─── */
body.edu { margin: 0; }
.edu-header { position: sticky; top: 0; z-index: 50; width: 100%; background: color-mix(in srgb, var(--paper) 85%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.edu-header-inner { max-width: var(--shell-max); margin: 0 auto; padding: var(--sp-2) var(--sp-5); display: flex; align-items: center; gap: var(--sp-3); box-sizing: border-box; }
.edu-logo { width: 64px; height: 64px; display: block; margin-right: -6px; }
.edu-wordmark { font-family: var(--font-display); font-weight: 700; font-size: var(--h4); letter-spacing: -.02em; color: var(--ink); }
.edu-lead { font-size: var(--body-lg); color: var(--ink-2); margin: var(--sp-3) 0 0; }

/* ─── Base ─── */
.shell { width: 100%; max-width: var(--shell-max); margin-inline: auto; padding-inline: var(--sp-5); box-sizing: border-box; }
main > section { margin-block: var(--sp-12); }
.hero { text-align: center; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.lane-chip { display: inline-block; background: var(--lane); color: var(--lane-ink); border-radius: var(--r-pill); padding: 2px 12px; font: 600 var(--caption)/1.6 var(--font-mono); text-transform: uppercase; letter-spacing: .04em; }
.lang-btn { margin-left: auto; background: var(--paper-2); color: var(--ink); border: 0; border-radius: var(--r-pill); padding: 6px 14px; font: 600 var(--caption) var(--font-mono); cursor: pointer; }
.lang-btn:focus-visible, .btn:focus-visible, .scenario-btn:focus-visible, .choose-go:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* ─── Controls ─── */
.controls { position: sticky; bottom: 0; z-index: 2; background: var(--paper); border-top: 1px solid var(--line); padding-block: var(--sp-3); display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); max-width: var(--matrix-max); margin: var(--sp-5) auto 0; padding-inline: var(--sp-5); box-sizing: border-box; }
.btn { border: 0; border-radius: var(--r-pill); padding: 10px 20px; font: 600 var(--body-sm) var(--font-sans); cursor: pointer; transition: background-color .2s ease; }
.btn-primary { background: var(--yellow); color: var(--yellow-ink); }
.btn-secondary { background: var(--paper-2); color: var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.progress { flex: 1 1 10rem; height: 8px; background: var(--paper-3); border-radius: var(--r-pill); overflow: hidden; }
.progress-fill { display: block; height: 100%; width: 0; background: var(--yellow); transition: width .3s ease; }
.progress-label { font: 500 var(--caption) var(--font-mono); color: var(--ink-2); }
/* ─── Scenario picker & question ─── */
.scenario-picker { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-block: var(--sp-3) var(--sp-5); }
.scenario-btn { display: grid; grid-template-columns: auto 1fr; column-gap: var(--sp-2); text-align: start; background: var(--paper-2); color: var(--ink); border: 0; border-radius: var(--r-lg); padding: var(--sp-3) var(--sp-4); cursor: pointer; transition: background-color .2s ease; }
.scenario-btn[aria-pressed="true"] { background: var(--yellow); color: var(--yellow-ink); }
.scenario-key { grid-row: span 2; align-self: center; font: 600 var(--caption) var(--font-mono); background: var(--surface); color: var(--ink); border-radius: var(--r-pill); padding: 2px 8px; }
.scenario-tab { font: 600 var(--body-sm) var(--font-display); }
.scenario-hint { font: var(--caption) var(--font-sans); color: inherit; opacity: .8; }
.question-wrap { margin: 0 0 var(--sp-5); }
.question { margin: var(--sp-2) 0 0; font: 600 var(--body-lg)/1.5 var(--font-display); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--sp-4) var(--sp-5); box-shadow: var(--shadow-sm); }

/* ─── Matrix ─── */
.matrix { display: grid; grid-template-columns: var(--row-head-w) repeat(3, minmax(0, 1fr)); gap: var(--sp-3); max-width: var(--matrix-max); margin-inline: auto; padding-inline: var(--sp-5); box-sizing: border-box; }
.lane-head { background: var(--lane); color: var(--lane-ink); border-radius: var(--r-lg); padding: var(--sp-4); }
.lane-name { margin: 0; font: 700 var(--h3, var(--body-lg)) var(--font-display); }
.lane-tagline { margin: 2px 0 0; font: var(--body-sm) var(--font-sans); }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1); list-style: none; margin: var(--sp-3) 0 0; padding: 0; }
.flow-node { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); color: var(--ink); border: 2px solid transparent; border-radius: var(--r-pill); padding: 2px 10px; font: 500 var(--caption)/1.5 var(--font-mono); transition: background-color .25s ease; }
.flow-node + .flow-node::before { content: '→'; margin-right: 6px; color: var(--ink-3); }
.flow-node[data-added="true"] { border-color: var(--ink); }
.flow-node.is-active { background: var(--yellow); color: var(--yellow-ink); }
/* .edu-block makes li inherit the lane's white text; chips sit on white, so pin their ink. */
.lane-head .flow-node { color: var(--ink); }
.lane-head .flow-node.is-active { color: var(--yellow-ink); }
.added-badge { font: 600 var(--caption) var(--font-mono); text-transform: uppercase; }
.row-head { display: flex; gap: var(--sp-2); align-items: flex-start; padding: var(--sp-4) var(--sp-3); background: var(--paper-2); color: var(--ink); border-radius: var(--r-md); font: 600 var(--body-sm)/1.4 var(--font-display); transition: background-color .25s ease; }
.row-num { font: 600 var(--caption) var(--font-mono); background: var(--surface); border-radius: var(--r-pill); padding: 0 8px; }
.row-head[data-cell="current"] { background: var(--yellow); color: var(--yellow-ink); }
.row-head, .cell { scroll-margin-top: 96px; scroll-margin-bottom: 120px; }
.cell { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--sp-4); box-shadow: var(--shadow-sm); font: var(--body-sm)/1.5 var(--font-sans); }
.cell[data-cell="hidden"] { background: var(--paper-2); border-style: dashed; box-shadow: none; }
.cell[data-cell="hidden"] .cell-content { display: none; }
.cell:not([data-cell="hidden"]) .cell-placeholder { display: none; }
.cell-placeholder { margin: 0; color: var(--ink-3); font: var(--caption) var(--font-mono); }
.cell[data-cell="current"] { outline: 3px solid var(--yellow); animation: cell-in .35s ease; }
@keyframes cell-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.cell[data-use="unavailable"]:not([data-cell="hidden"]), .cell[data-use="unused"]:not([data-cell="hidden"]) { background: var(--paper-2); color: var(--ink-2); box-shadow: none; }
.use-badge { display: inline-block; margin-bottom: var(--sp-2); background: var(--ink); color: var(--paper); border-radius: var(--r-pill); padding: 2px 10px; font: 500 var(--caption) var(--font-mono); }
.cell[data-use="unused"] .use-badge { background: var(--paper-3); color: var(--ink); }
.cell-title { margin: 0 0 4px; font-weight: 600; }
.cell-body { margin: 0; }
.cell-items { margin: var(--sp-2) 0 0; padding-left: 1.2em; font-size: var(--caption); }
.answer { margin: 0; background: var(--paper-2); border-radius: var(--r-sm); padding: var(--sp-3); }
.loop { list-style: none; margin: var(--sp-2) 0 0; padding: 0; display: grid; gap: var(--sp-1); font-size: var(--caption); }
.loop-step { display: grid; grid-template-columns: 7.5rem 1fr; gap: var(--sp-2); align-items: start; }
.loop-kind { justify-self: start; background: var(--lane); color: var(--lane-ink); border-radius: var(--r-pill); padding: 0 8px; font: 500 var(--caption) var(--font-mono); text-transform: uppercase; }
.loop-step[data-kind="reflect"] .loop-kind { background: var(--paper-3); color: var(--ink); }
/* ─── Verdict ─── */
.grade { display: inline-block; margin-bottom: var(--sp-2); background: var(--paper-3); color: var(--ink); border-radius: var(--r-pill); padding: 2px 12px; font: 600 var(--caption) var(--font-mono); text-transform: uppercase; }
.grade[data-grade="fail"] { background: var(--red); color: var(--red-ink); }
.cell[data-winner="true"]:not([data-cell="hidden"]) { background: var(--yellow); color: var(--yellow-ink); }
.cell[data-winner="true"] .grade { background: var(--ink); color: var(--paper); }
.cost { display: grid; grid-template-columns: auto 1fr; gap: 2px var(--sp-3); margin: var(--sp-3) 0 var(--sp-2); font-size: var(--caption); }
.cost dt { color: inherit; opacity: .8; }
.cost dd { margin: 0; text-align: end; font-family: var(--font-mono); }
.cost-bar { height: 8px; background: var(--paper-3); border-radius: var(--r-pill); overflow: hidden; }
.cost-bar-fill { display: block; height: 100%; background: var(--lane); }
/* ─── Ladder ─── */
.ladder-list { list-style: none; padding: 0; margin: var(--sp-5) 0 var(--sp-3); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-4); }
.ladder-step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--sp-5); box-shadow: var(--shadow-sm); }
.ladder-tagline { margin: var(--sp-3) 0 4px; font: 700 var(--body-lg) var(--font-display); }
.ladder-adds { margin: 0 0 var(--sp-3); font: 500 var(--caption) var(--font-mono); color: var(--ink-2); }
.ladder-analogy { margin: 0; color: var(--ink-2); }

/* ─── Compare ─── */
.table-wrap { overflow-x: auto; }
.compare-table { width: 100%; border-collapse: separate; border-spacing: 0; font: var(--body-sm)/1.5 var(--font-sans); }
.compare-table th, .compare-table td { padding: var(--sp-3); text-align: start; vertical-align: top; border-bottom: 1px solid var(--line); }
.compare-table tbody th { font-weight: 600; color: var(--ink); }
.compare-table td { color: var(--ink-2); }

/* ─── Choose ─── */
.choose-list { list-style: none; padding: 0; margin: var(--sp-5) 0 0; display: grid; gap: var(--sp-3); counter-reset: q; }
.choose-step { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-3); background: var(--paper-2); border-radius: var(--r-lg); padding: var(--sp-4) var(--sp-5); counter-increment: q; }
.choose-q { margin: 0; font: 600 var(--body) var(--font-display); }
.choose-q::before { content: counter(q) '. '; font-family: var(--font-mono); }
.choose-go { display: inline-flex; align-items: center; gap: var(--sp-2); background: var(--surface); color: var(--ink); border: 0; border-radius: var(--r-pill); padding: 6px 14px 6px 6px; font: 600 var(--caption) var(--font-sans); cursor: pointer; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* ─── Phone ─── */
@media (max-width: 768px) {
  .shell, .matrix, .controls { padding-inline: var(--sp-4); }
  .ladder-list { grid-template-columns: minmax(0, 1fr); }
  .matrix { grid-template-columns: minmax(0, 1fr); }
  .matrix-corner, .lane-head { display: none; }
  .row-head[data-cell="hidden"], .cell[data-cell="hidden"] { display: none; }
  .row-head { margin-top: var(--sp-3); }
  .cell::before { content: attr(data-lane-name); display: inline-block; margin-bottom: var(--sp-2); background: var(--lane); color: var(--lane-ink); border-radius: var(--r-pill); padding: 2px 10px; font: 600 var(--caption) var(--font-mono); text-transform: uppercase; }
  .loop-step { grid-template-columns: minmax(0, 1fr); }

            process: { title: 'Loop: plan, tool, check', body: 'It breaks the question into steps and runs them one by one.', loop: ['Define the term, pick an example, check it is correct.', 'Search for the definition of inflation on central bank and statistics office sites.', 'The sources match what the model already knew.', 'The example is simple and clear. Ready to answer.'] },
            action: { title: 'No actions', body: 'Nothing outside the conversation needed changing.' },
            answer: { body: 'Inflation is a rise in prices that makes money lose value: 20 zł buys 4 loaves of bread today instead of 5 a year ago (in line with the central bank definition).' },
            verdict: { body: 'Same result as the chat, but after several steps, with many times more tokens and a longer wait.' }
          }
        }
      },
      company: {
        tab: 'Company documents', hint: 'RAG wins here',
        question: 'How many days of annual leave do I get after 3 years at our company, and how many days a week can I work remotely?',
        lanes: {
          chat: {
            source: { title: 'Model memory', body: 'It knows the Polish Labour Code, but not your company rules.' },
            process: { title: 'Single pass', body: 'It answers straight away from general knowledge.' },
            action: { title: 'No actions', body: 'A chat only answers with text.' },
            answer: { body: 'Under the Polish Labour Code you get 20 days of leave with less than 10 years of service, or 26 days with at least 10 years (education counts towards service). Remote work rules are set by your employer, so check the work regulations or ask HR.' },
            verdict: { body: 'Sounds authoritative, but it is a generic answer. The chat does not know the extra leave days or the remote work rules at your company.' }
          },
          rag: {
            source: { title: 'Company documents', body: 'It finds 3 matching passages in the base.', items: ['Work regulations 2026, § 12: Leave', 'Work regulations 2026, § 7: Remote work', 'HR FAQ: length of service'] },
            process: { title: 'Question + 3 passages from the regulations', body: 'It adds about 1800 tokens from the regulations and writes an answer that cites them.' },
            action: { title: 'No actions', body: 'RAG only answers with text.' },
            answer: { body: 'After 3 years at the company you get 2 days of leave on top of the Labour Code entitlement, so 22 or 28 days depending on your total length of service (Work regulations, § 12). You can work remotely up to 3 days a week; Tuesdays and Thursdays are office days (§ 7).' },
            verdict: { body: 'A specific answer from your own documents, with the source. Fast and cheap.' }
          },
          agent: {
            source: { title: 'Company documents + tools', body: 'It searches the document base and can check other systems, e.g. HR announcements.' },
            process: { title: 'Loop: plan, tool, check', body: 'It looks for the answer, then makes sure the regulations are current.', loop: ['Find the leave and remote work rules, check for recent changes.', 'Search company documents: leave, remote work.', 'Found § 7 and § 12. Still need to check for changes.', 'Review HR announcements from the last 6 months.', 'No changes. The regulations are current.'] },
            action: { title: 'No actions', body: 'Nothing outside the conversation needed changing.' },
            answer: { body: '22 or 28 days of leave (2 days on top of the Labour Code, § 12) and up to 3 remote days a week, with Tuesdays and Thursdays in the office (§ 7). The regulations have not changed in the last 6 months.' },
            verdict: { body: 'The same answer as RAG, plus a check for changes. It costs several times more and takes longer.' }
          }
        }
      },
      task: {
        tab: 'Multi-step task', hint: 'Needs an agent',
        question: 'Check which artists I listened to most this month, find their concerts in Warsaw and add the dates to my calendar.',
        lanes: {
          chat: {
            source: { title: 'Model memory', body: 'It does not know your listening history or your calendar.' },
            process: { title: 'Single pass', body: 'All it can do is describe the steps for you.' },
            action: { title: 'No access', body: 'It cannot connect to Spotify or your calendar.' },
            answer: { body: 'I do not have access to your listening history or your calendar. Check your stats in your music app, look up concerts on a ticketing site and add the events to your calendar yourself.' },
            verdict: { body: 'The chat only gives instructions. The task needs your data and actions in several services.' }
          },
          rag: {
            source: { title: 'Document base', body: 'It finds a concert listing, but does not know who you listen to.', items: ['Concerts in Warsaw, November and December 2026'] },
            process: { title: 'Question + concert listing', body: 'It adds the listing to the question and writes an answer.' },
            action: { title: 'No access', body: 'It cannot add events to a calendar.' },
            answer: { body: 'The base lists concerts in Warsaw, including at Torwar, Progresja and Stodoła. But I do not know who you listen to, and I cannot add events to your calendar.' },
            verdict: { body: 'Partly: it found concerts, but it does not know your taste and cannot add them to your calendar.' }
          },
          agent: {
            source: { title: 'Your accounts, through tools', body: 'It connects to Spotify, a ticketing service and your calendar through their APIs.' },
            process: { title: 'Loop: plan, tool, check', body: 'It does the task step by step and checks every result.', loop: ['Get top artists, find concerts, add them to the calendar, check.', 'Spotify: your 10 most played artists this month.', 'Got 10 artists. Looking for their concerts.', 'Ticketing service: concerts by these artists in Warsaw.', '3 concerts match. Adding them to the calendar.', 'Google Calendar: 3 events with reminders.', 'All 3 events are in the calendar.'] },
            action: { title: 'Added 3 events to your calendar', body: 'With the venue address, a ticket link and a reminder.', items: ['Nocne Tramwaje: 12 December, Torwar', 'Biały Szum: 9 January, Progresja', 'Mgła nad Wisłą: 21 February, Stodoła'] },
            answer: { body: 'Done. Found 3 concerts by your favourite artists in Warsaw and added them to your calendar, with reminders a week and a day before.' },
            verdict: { body: 'Only the agent combines data from several services and acts on your behalf. That has a price: the most tokens and the longest wait.' }
          }
        }
      }
    },
    footer: 'Educational simulation. No AI model is called here; the company and the artists are fictional.',
    langSwitch: 'PL', langSwitchLabel: 'Przełącz na polski'
  }
};

// ─── State ───
const App = { lang: 'pl', scenarioId: 'general', step: 0, playing: false, timer: null };
try { const saved = localStorage.getItem(LANG_KEY); if (saved === 'pl' || saved === 'en') App.lang = saved; } catch {}

// ─── DOM refs ───
const $ = id => document.getElementById(id);
const rootEl = $('app');
const langBtn = $('langBtn');
const ladderList = $('ladderList');
const demoEl = $('demo');
const scenarioPicker = $('scenarioPicker');
const questionEl = $('question');
const matrixEl = $('matrix');
const prevBtn = $('prevBtn');
const nextBtn = $('nextBtn');
const playBtn = $('playBtn');
const resetBtn = $('resetBtn');
const progressEl = $('progress');
const progressFill = $('progressFill');
const progressLabel = $('progressLabel');
const liveEl = $('live');
const compareTable = $('compareTable');
const chooseList = $('chooseList');

// ─── Helpers ───
function t(key) { return T[App.lang][key]; }
function fmt(template, vars) { return template.replace(/\{(\w+)\}/g, (_, k) => String(vars[k])); }
function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'text') node.textContent = value;
    else if (key === 'class') node.className = value;
    else if (key === 'dataset') Object.assign(node.dataset, value);
    else node.setAttribute(key, value === true ? '' : value);
  }
  node.append(...children.filter(Boolean));
  return node;
}
function scenarioText() { return t('scenarios')[App.scenarioId]; }
function meta() { return SCENARIO_META[App.scenarioId]; }
function locale() { return App.lang === 'pl' ? 'pl-PL' : 'en-GB'; }
function num(v) { return v.toLocaleString(locale()); }
function money(v) { return new Intl.NumberFormat(locale(), { style: 'currency', currency: 'PLN' }).format(v); }
function totalTokens(cost) { return cost.in + cost.out; }
function costPerThousand(cost) { return (cost.in * PRICE_PLN_PER_MTOK.in + cost.out * PRICE_PLN_PER_MTOK.out) / 1000; }

// Actions: every change goes through these, then render().
function stopPlay() { App.playing = false; clearTimeout(App.timer); App.timer = null; }
function goTo(step) {
  App.step = Math.max(0, Math.min(PHASES.length, step));
  if (App.step === PHASES.length) stopPlay();
  render();
  revealCurrentRow();
}
// Keep the row just revealed in view: desktop keeps the whole row above the sticky controls,
// phones (row stacked into three cells) start the row at its heading under the sticky header.
function revealCurrentRow() {
  const cells = matrixEl.querySelectorAll('.cell[data-cell="current"]');
  if (!cells.length) return;
  const behavior = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  if (matchMedia(PHONE_QUERY).matches) matrixEl.querySelector('.row-head[data-cell="current"]').scrollIntoView({ block: 'start', behavior });
  else cells[cells.length - 1].scrollIntoView({ block: 'nearest', behavior });
}
function next() { goTo(App.step + 1); }
function userNext() { stopPlay(); next(); }
function prev() { stopPlay(); goTo(App.step - 1); }
function reset() { stopPlay(); goTo(0); }
function tick() {
  next();
  if (App.playing) App.timer = setTimeout(tick, AUTO_MS);
}
function togglePlay() {
  if (App.playing) { stopPlay(); render(); return; }
  if (App.step === PHASES.length) App.step = 0;
  App.playing = true;
  tick();
}
function setScenario(id) {
  if (!SCENARIO_IDS.includes(id)) return;
  stopPlay();
  App.scenarioId = id;
  App.step = 0;
  buildMatrix();
  render();
}
function setLang(lang) {
  if (!T[lang]) return;
  stopPlay();
  App.lang = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch {}
  build();
  render();
}

// ─── Render ───
function applyI18n() {
  document.documentElement.lang = App.lang;
  document.title = t('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(node => { node.textContent = t(node.dataset.i18n); });
  langBtn.textContent = t('langSwitch');
  langBtn.setAttribute('aria-label', t('langSwitchLabel'));
}
function buildPicker() {
  const scenarios = t('scenarios');
  scenarioPicker.replaceChildren(...SCENARIO_IDS.map((id, i) => el('button', { type: 'button', class: 'scenario-btn', dataset: { scenarioId: id }, 'aria-pressed': 'false' }, [
    el('span', { class: 'scenario-key', text: String(i + 1) }),
    el('span', { class: 'scenario-tab', text: scenarios[id].tab }),
    el('span', { class: 'scenario-hint', text: scenarios[id].hint })
  ])));
}
function buildFlow(lane) {
  const nodes = t('nodes');
  return el('ol', { class: 'flow', 'aria-label': t('flowLabel') }, FLOW[lane].map(n => el('li', { class: 'flow-node', dataset: { lane, node: n.id, added: n.added ? 'true' : 'false' } }, [
    el('span', { text: nodes[n.id] }),
    n.added ? el('span', { class: 'added-badge', text: t('added') }) : null
  ])));
}
function buildVerdict(lane, text, m) {
  const laneMeta = m.lanes[lane];
  const tokens = totalTokens(laneMeta.cost);
  const maxTokens = Math.max(...LANES.map(l => totalTokens(m.lanes[l].cost)));
  return [
    el('span', { class: 'grade', dataset: { grade: laneMeta.grade }, text: t('grades')[laneMeta.grade] }),
    el('p', { class: 'cell-body', text: text.body }),
    el('dl', { class: 'cost' }, [
      el('dt', { text: t('costTokens') }), el('dd', { dataset: { tokens: String(tokens) }, text: num(tokens) }),
      el('dt', { text: t('costTime') }), el('dd', { text: fmt(t('seconds'), { n: laneMeta.cost.seconds }) }),
      el('dt', { text: t('costThousand') }), el('dd', { text: money(costPerThousand(laneMeta.cost)) })
    ]),
    el('div', { class: 'cost-bar', 'aria-hidden': 'true' }, [
      el('span', { class: 'cost-bar-fill', style: `width: ${Math.max(2, Math.round(tokens / maxTokens * 100))}%` })
    ])
  ];
}
function buildCell(lane, phase, text, m) {
  const laneMeta = m.lanes[lane];
  const use = laneMeta.use[phase] || 'used';
  const content = el('div', { class: 'cell-content' });
  if (phase === 'answer') {
    content.append(el('blockquote', { class: 'answer', text: text.body }));
  } else if (phase === 'verdict') {
    content.append(...buildVerdict(lane, text, m));
  } else {
    if (use !== 'used') content.append(el('span', { class: 'use-badge', text: t('use')[use] }));
    content.append(el('p', { class: 'cell-title', text: text.title }), el('p', { class: 'cell-body', text: text.body }));
    if (text.items) content.append(el('ul', { class: 'cell-items' }, text.items.map(item => el('li', { text: item }))));
    if (text.loop) content.append(el('ol', { class: 'loop' }, text.loop.map((step, i) => el('li', { class: 'loop-step', dataset: { kind: laneMeta.loop[i] } }, [
      el('span', { class: 'loop-kind', text: t('loopKinds')[laneMeta.loop[i]] }),
      el('span', { text: step })
    ]))));
  }
  const laneName = t('ladder')[lane].name;
  return el('div', {
    class: 'cell', role: 'group', 'aria-label': `${laneName}: ${t('phases')[phase]}`,
    dataset: { lane, phase, use, laneName, winner: phase === 'verdict' && lane === m.winner ? 'true' : 'false' }
  }, [el('p', { class: 'cell-placeholder', text: t('pending') }), content]);
}
function buildMatrix() {
  const s = scenarioText();
  const m = meta();
  const ladder = t('ladder');
  questionEl.textContent = s.question;
  const heads = [el('div', { class: 'matrix-corner', 'aria-hidden': 'true' }), ...LANES.map(lane => el('div', { class: 'lane-head edu-block', dataset: { lane } }, [
    el('h3', { class: 'lane-name', text: ladder[lane].name }),
    el('p', { class: 'lane-tagline', text: ladder[lane].tagline }),
    buildFlow(lane)
  ]))];
  const rows = PHASES.flatMap((phase, i) => [
    el('div', { class: 'row-head', dataset: { phase } }, [
      el('span', { class: 'row-num', text: String(i + 1) }),
      el('span', { class: 'row-label', text: t('phases')[phase] })
    ]),
    ...LANES.map(lane => buildCell(lane, phase, s.lanes[lane][phase], m))
  ]);
  matrixEl.replaceChildren(...heads, ...rows);
}
function buildLadder() {
  const ladder = t('ladder');
  ladderList.replaceChildren(...LANES.map(lane => el('li', { class: 'ladder-step', dataset: { lane } }, [
    el('span', { class: 'lane-chip', text: ladder[lane].name }),
    el('p', { class: 'ladder-tagline', text: ladder[lane].tagline }),
    el('p', { class: 'ladder-adds', text: ladder[lane].adds }),
    el('p', { class: 'ladder-analogy', text: ladder[lane].analogy })
  ])));
}
function buildCompare() {
  const ladder = t('ladder');
  const head = el('thead', {}, [el('tr', {}, [
    el('th', { scope: 'col', text: t('compareFeature') }),
    ...LANES.map(lane => el('th', { scope: 'col', dataset: { lane } }, [el('span', { class: 'lane-chip', text: ladder[lane].name })]))
  ])]);
  const body = el('tbody', {}, t('compareRows').map(([label, ...values]) => el('tr', {}, [
    el('th', { scope: 'row', text: label }),
    ...values.map((value, i) => el('td', { dataset: { lane: LANES[i] }, text: value }))
  ])));
  compareTable.replaceChildren(el('caption', { class: 'sr-only', text: t('compareTitle') }), head, body);
}
function buildChoose() {
  chooseList.replaceChildren(...t('choose').map(item => {
    const scenarioId = SCENARIO_IDS.find(id => SCENARIO_META[id].winner === item.lane);
    return el('li', { class: 'choose-step', dataset: { lane: item.lane } }, [
      el('p', { class: 'choose-q', text: item.q }),
      el('button', { type: 'button', class: 'choose-go', dataset: { goScenario: scenarioId } }, [
        el('span', { class: 'lane-chip', text: t('ladder')[item.lane].name }),
        el('span', { text: t('chooseShow') })
      ])
    ]);
  }));
}
function build() { applyI18n(); buildLadder(); buildPicker(); buildMatrix(); buildCompare(); buildChoose(); }
function render() {
  const total = PHASES.length;
  const status = App.step === 0 ? 'idle' : App.step === total ? 'done' : 'running';
  const phase = PHASES[App.step - 1] || null;
  Object.assign(rootEl.dataset, { lang: App.lang, scenario: App.scenarioId, step: String(App.step), status, playing: String(App.playing) });
  matrixEl.querySelectorAll('[data-phase]').forEach(node => {
    const index = PHASES.indexOf(node.dataset.phase) + 1;
    node.dataset.cell = index < App.step ? 'shown' : index === App.step ? 'current' : 'hidden';
  });
  matrixEl.querySelectorAll('.flow-node').forEach(node => {
    node.classList.toggle('is-active', phase !== null && FLOW_HIGHLIGHT[node.dataset.lane][phase] === node.dataset.node);
  });
  scenarioPicker.querySelectorAll('.scenario-btn').forEach(btn => btn.setAttribute('aria-pressed', String(btn.dataset.scenarioId === App.scenarioId)));
  prevBtn.disabled = App.step === 0;
  nextBtn.disabled = App.step === total;
  playBtn.textContent = t(App.playing ? 'pause' : 'play');
  playBtn.setAttribute('aria-pressed', String(App.playing));
  progressEl.setAttribute('aria-valuenow', String(App.step));
  progressFill.style.width = `${App.step / total * 100}%`;
  const label = status === 'idle' ? t('stepIdle') : `${fmt(t('stepOf'), { n: App.step, total })}: ${t('phases')[phase]}`;
  progressLabel.textContent = label;
  liveEl.textContent = status === 'done' ? `${label}. ${t('winner')}: ${t('ladder')[meta().winner].name}` : label;
}

// ─── Listeners ───
prevBtn.addEventListener('click', prev);
nextBtn.addEventListener('click', userNext);
playBtn.addEventListener('click', togglePlay);
resetBtn.addEventListener('click', reset);
langBtn.addEventListener('click', () => setLang(App.lang === 'pl' ? 'en' : 'pl'));
scenarioPicker.addEventListener('click', e => {
  const btn = e.target.closest('.scenario-btn');
  if (btn) setScenario(btn.dataset.scenarioId);
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  // A focused button already handles Space/Enter natively; handling it here too would double-step.
  if ((e.key === ' ' || e.key === 'Enter') && e.target.closest && e.target.closest('button')) return;
  const key = e.key.toLowerCase();
  if (key === 'arrowright' || key === ' ') { e.preventDefault(); userNext(); }
  else if (key === 'arrowleft') { e.preventDefault(); prev(); }
  else if (key === 'r') reset();
  else if (key === 'a') togglePlay();
  else if (key === 'l') setLang(App.lang === 'pl' ? 'en' : 'pl');
  else if (['1', '2', '3'].includes(key)) setScenario(SCENARIO_IDS[Number(key) - 1]);
});

chooseList.addEventListener('click', e => {
  const btn = e.target.closest('.choose-go');
  if (!btn) return;
  setScenario(btn.dataset.goScenario);
  demoEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

// ─── Init ───
build();
render();
// ─── Reveal ───
const FONT_WAIT_MS = 1500;
const BRAND_FONTS = ['400 1em Outfit', '700 1em Outfit', '400 1em "IBM Plex Sans"', '600 1em "IBM Plex Sans"', '400 1em "Roboto Mono"'];
Promise.race([
  Promise.all(BRAND_FONTS.map(f => document.fonts.load(f).catch(() => null))),
  new Promise(r => setTimeout(r, FONT_WAIT_MS))
]).then(() => document.documentElement.classList.add('app-ready'));
</script>
</body>
</html>
